<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>chloeeezyMC - Sub Count Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  #stage {
    position: fixed;
    left: 0;
    bottom: 70px;
    width: 100%;
    height: 160px;
    pointer-events: none;
  }

  .card {
    position: absolute;
    left: 40px;
    top: 20px;
    display: flex;
    align-items: stretch;
    width: 340px;
    height: 118px;
    background: linear-gradient(160deg, #FFF6F9 0%, #FFE3ED 100%);
    border: 3px solid #FF6B9D;
    border-radius: 26px;
    box-shadow: 0 12px 26px rgba(219, 39, 119, 0.25);
    animation: float 2.4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 26px;
    opacity: 0.5;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,107,157,0.10) 0 6px, transparent 7px),
      radial-gradient(circle at 60% 70%, rgba(255,107,157,0.10) 0 6px, transparent 7px),
      radial-gradient(circle at 85% 25%, rgba(255,107,157,0.08) 0 5px, transparent 6px);
    pointer-events: none;
  }

  .icon-chip {
    position: relative;
    flex: 0 0 100px;
    margin: 9px 0 9px 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFDFC;
    border-radius: 50%;
    overflow: hidden;
  }

  .icon-chip img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .icon-fallback {
    display: none;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #FF9FB3;
    color: #FFFDFC;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 26px;
  }

  .info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    padding: 0 22px 0 18px;
    min-width: 0;
  }

  .label {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: #D6336C;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .count {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: #7A2E4A;
    white-space: nowrap;
  }

  .count.bump {
    animation: pop 0.4s ease;
  }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  .progress-track {
    width: 100%;
    height: 14px;
    background: rgba(255, 107, 157, 0.15);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 6px;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #FF9FB3, #FF6B9D);
    border-radius: 999px;
    transition: width 0.8s ease;
  }

  .garland {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .garland .bloom {
    position: absolute;
    width: 20px;
    height: 20px;
  }
</style>
</head>
<body>

<div id="stage">
  <div class="card" id="card">
    <div class="garland" id="garland"></div>

    <div class="icon-chip">
      <img id="logoImg" alt="" />
      <div class="icon-fallback" id="logoFallback">Y</div>
    </div>
    <div class="info">
      <div class="label">Subscribers</div>
      <div class="count" id="countText">— / 600</div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>
</div>

<script>
  
  const YT_API_KEY = 'AIzaSyAZ0Ro3_XQpzz7XA1xJwbsFQ2h8K0BQf-4';
  const YT_CHANNEL_ID = 'UCEhAxizKRZMffNpoxLNs-1Q';
  const LOGO_URL = 'https://raw.githubusercontent.com/zskv-coding/chloe-socialsobs/main/youtube_logo.png';

  const REFRESH_MS = 60000;
  const SUB_GOAL = 600;

  const countText = document.getElementById('countText');
  const progressFill = document.getElementById('progressFill');
  const logoImg = document.getElementById('logoImg');
  const logoFallback = document.getElementById('logoFallback');
  const garland = document.getElementById('garland');

  logoImg.onload = () => {
    logoImg.style.display = 'block';
    logoFallback.style.display = 'none';
  };
  logoImg.onerror = () => {
    logoImg.style.display = 'none';
    logoFallback.style.display = 'flex';
  };
  logoImg.src = LOGO_URL;

  // Pink & dark pink palette for the heart garland
  const heartColors = ['#FF6B9D', '#DB2777', '#F472B6', '#BE185D', '#FB7185'];

  function heartSVG(color) {
    return `<svg viewBox="0 0 22 22" width="100%" height="100%">
      <path d="M11 19.5 C11 19.5 2 13.7 2 7.8 C2 4.6 4.4 2.5 7.1 2.5 C8.9 2.5 10.3 3.5 11 4.9 C11.7 3.5 13.1 2.5 14.9 2.5 C17.6 2.5 20 4.6 20 7.8 C20 13.7 11 19.5 11 19.5 Z" fill="${color}"/>
    </svg>`;
  }

  function buildGarland() {
    const cardWidth = 340;
    const cardHeight = 118;
    const topCount = 5;
    const bottomCount = 5;

    for (let i = 0; i < topCount; i++) {
      const bloom = document.createElement('div');
      bloom.className = 'bloom';
      bloom.style.left = `${20 + (i * (cardWidth - 90) / (topCount - 1))}px`;
      bloom.style.top = '-10px';
      bloom.innerHTML = heartSVG(heartColors[i % heartColors.length]);
      garland.appendChild(bloom);
    }

    for (let i = 0; i < bottomCount; i++) {
      const bloom = document.createElement('div');
      bloom.className = 'bloom';
      bloom.style.left = `${20 + (i * (cardWidth - 90) / (bottomCount - 1))}px`;
      bloom.style.bottom = '-10px';
      bloom.innerHTML = heartSVG(heartColors[(i + 2) % heartColors.length]);
      garland.appendChild(bloom);
    }

    [18, cardHeight - 30].forEach((topPos, idx) => {
      const bloom = document.createElement('div');
      bloom.className = 'bloom';
      bloom.style.left = '-10px';
      bloom.style.top = `${topPos}px`;
      bloom.innerHTML = heartSVG(heartColors[(idx + 4) % heartColors.length]);
      garland.appendChild(bloom);
    });

    [18, cardHeight - 30].forEach((topPos, idx) => {
      const bloom = document.createElement('div');
      bloom.className = 'bloom';
      bloom.style.right = '-10px';
      bloom.style.top = `${topPos}px`;
      bloom.innerHTML = heartSVG(heartColors[(idx + 1) % heartColors.length]);
      garland.appendChild(bloom);
    });
  }

  buildGarland();

  function formatCount(n) {
    return Number(n).toLocaleString('en-US');
  }

  let lastCount = null;

  async function fetchSubCount() {
    try {
      const url = `https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${YT_CHANNEL_ID}&key=${YT_API_KEY}`;
      const res = await fetch(url);
      const data = await res.json();
      const count = data.items[0].statistics.subscriberCount;

      countText.textContent = `${formatCount(count)} / ${formatCount(SUB_GOAL)}`;
      const percent = Math.min(100, (count / SUB_GOAL) * 100);
      progressFill.style.width = `${percent}%`;

      if (lastCount !== null && count !== lastCount) {
        countText.classList.remove('bump');
        void countText.offsetWidth;
        countText.classList.add('bump');
      }
      lastCount = count;
    } catch (err) {
      countText.textContent = 'Error';
    }
  }

  fetchSubCount();
  setInterval(fetchSubCount, REFRESH_MS);
</script>

</body>
</html>
